<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>PetShop - Login</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="box-login">
				<div class="card shadow-lg">
					<div class="card-header text-center bg-info text-white">
						<h3>PETSHOP - Portal Web</h3>
					</div>

					<div class="card-body">
						<h5 class="text-center mb-4">Inicio de Sesión</h5>

						<form th:action="@{/iniciar-sesion}" method="get" th:object="${filter}">
							<div class="mb-3">
								<label class="form-label">Correo electrónico (Email)</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
									<input type="email" class="form-control" placeholder="admin@petshop.com" th:field="*{email}">
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label">Contraseña (Hash)</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-key"></i></span>
									<input type="password" class="form-control" placeholder="Contraseña o Hash" th:field="*{passwordHash}">
								</div>
								<div class="form-text">Nota: Contraseña por defecto admin123 (hash pre-cargado).</div>
							</div>

							<div class="d-grid">
								<button type="submit" class="btn btn-dark">
									<i class="fas fa-sign-in-alt"></i> INGRESAR
								</button>
							</div>
						</form>
					</div>

					<div class="card-footer text-muted text-center">
						&copy; 2026 PETSHOP - Todos los derechos reservados
					</div>
				</div>
			</div>
		</div>
	</div>
	<th:block th:utext="${alert}"></th:block>
</body>
</html>
