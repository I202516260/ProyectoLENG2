<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
	<div class="card shadow-lg text-dark">
		<div class="card-body">
			<h1 class="card-title text-center">Registrar Nuevo Producto</h1>
			<div class="row d-flex justify-content-center">
				<div class="col-md-6">
					<form th:action="@{/producto/registrar}" class="row g-2" method="post" th:object="${producto}">
						<div class="col-md-12 position-relative">
							<label for="nombre" class="form-label">Nombre del Producto</label>
							<input type="text" class="form-control" placeholder="Ej: Correa retráctil" th:field="*{nombre}" required>
						</div>
						<div class="col-md-6 position-relative">
							<label for="stock" class="form-label">Stock</label>
							<div class="input-group">
								<span class="input-group-text"><i class="fa-solid fa-cubes-stacked"></i></span>
								<input class="form-control" type="number" placeholder="0" th:field="*{stock}" required>
							</div>
						</div>
						<div class="col-md-6 position-relative">
							<label for="precio" class="form-label">Precio</label>
							<div class="input-group">
								<span class="input-group-text">S/.</span>
								<input class="form-control" type="number" step="0.01" placeholder="Ej: 49.90" th:field="*{precio}" required>
							</div>
						</div>
						<div class="col-md-12 position-relative">
							<label for="imagenUrl" class="form-label">URL de Imagen (Opcional)</label>
							<input type="text" class="form-control" placeholder="/imagenes/producto.jpg" th:field="*{imagenUrl}">
						</div>
						<div class="col-md-12 position-relative">
							<label for="categoria" class="form-label">Categoría</label>
							<div class="input-group">
								<span class="input-group-text"><i class="fa-solid fa-tags"></i></span>
								<select class="form-select" th:field="*{categoria}" required>
									<option value="" selected hidden="hidden">--Seleccione Categoría--</option>
									<option th:each="item: ${lstCategorias}" th:value="${item.idCategoria}"
										th:text="${item.nombre}">
									</option>
								</select>
							</div>
						</div>
						<div class="col-md-12 d-flex justify-content-between mt-3">
							<a th:href="@{/producto/listado}" class="btn btn-outline-dark">
								<i class="fa-solid fa-reply"></i> Regresar
							</a>
							<button type="submit" class="btn btn-primary">
								<i class="fa-solid fa-floppy-disk"></i> Registrar
							</button>
							<button type="reset" class="btn btn-secondary">
								<i class="fa-solid fa-broom"></i> Limpiar
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>

</html>
